name: Legacy PepMAX vial generator (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-generator-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy generator is disabled
        run: |
          echo "The legacy 95-SVG vial generator is intentionally disabled."
          echo "PepMAX now uses verified real vial photography by SKU and neutral pending states."
          echo "Do not re-enable tools/generate-vials.mjs for production without explicit human approval."
