name: Commerce Core Quality

on:
  pull_request:
    paths:
      - 'commerce-core/**'
      - 'peptides/assets/catalog.js'
      - 'AGENTS.md'
      - '.github/workflows/commerce-core-quality.yml'
  push:
    branches:
      - 'feat/commerce-core-v1'
    paths:
      - 'commerce-core/**'
      - 'peptides/assets/catalog.js'
      - 'AGENTS.md'
      - '.github/workflows/commerce-core-quality.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool commerce-core/schemas/product.schema.json >/dev/null
          python -m json.tool commerce-core/schemas/order.schema.json >/dev/null
          python -m json.tool commerce-core/agents/manifest.json >/dev/null

      - name: Validate agent and orchestrator roles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('commerce-core/agents/manifest.json').read_text())
          ids={a['id'] for a in data['agents']}
          expected_agents={f'A{i}' for i in range(7)}
          missing_agents=expected_agents-ids
          if missing_agents:
              raise SystemExit(f'Missing agents: {sorted(missing_agents)}')
          orchestrator_ids={o['id'] for o in data.get('orchestrators', [])}
          expected_orchestrators={f'O{i}' for i in range(4)}
          missing_orchestrators=expected_orchestrators-orchestrator_ids
          if missing_orchestrators:
              raise SystemExit(f'Missing orchestrators: {sorted(missing_orchestrators)}')
          if any(o.get('can_bypass_qa') for o in data['orchestrators']):
              raise SystemExit('No orchestrator may bypass QA')
          if data['branch_policy'].get('direct_writes_to_main') is not False:
              raise SystemExit('direct_writes_to_main must remain false')
          if data['branch_policy'].get('require_qa_gate') is not True:
              raise SystemExit('require_qa_gate must remain true')
          print('Agent + orchestrator manifest OK')
          PY

      - name: Extract canonical catalog
        shell: bash
        run: |
          set -euo pipefail
          node commerce-core/scripts/extract-legacy-catalog.mjs peptides/assets/catalog.js /tmp/pepmax-products.json

      - name: Independent catalog audit
        shell: bash
        run: |
          set -euo pipefail
          node commerce-core/scripts/catalog-audit.mjs peptides/assets/catalog.js --json > /tmp/catalog-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('/tmp/catalog-audit.json').read_text())
          if audit['products'] != 100:
              raise SystemExit(f"Expected 100 products, found {audit['products']}")
          if audit['blockingIssues']:
              raise SystemExit(f"Blocking catalog findings: {audit['blockingIssues']}")
          print(f"Independent audit OK: {audit['products']} products / {audit['variants']} variants")
          print(f"Named SKUs: {audit['namedSkus']} | pending SKU normalization: {audit['unassignedSkus']}")
          PY

      - name: Generate sanitized public snapshot
        shell: bash
        run: |
          set -euo pipefail
          node commerce-core/scripts/generate-public-snapshot.mjs /tmp/pepmax-products.json /tmp/public-catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          canonical=json.loads(Path('/tmp/pepmax-products.json').read_text())
          public=json.loads(Path('/tmp/public-catalog.json').read_text())
          if public['productCount'] != canonical['audit']['productCount']:
              raise SystemExit('Public snapshot product parity failure')
          if public['variantCount'] != canonical['audit']['variantCount']:
              raise SystemExit('Public snapshot variant parity failure')
          forbidden={'private','supplier','supplierSku','cost','costCurrency','margin','notes','supplier_cost','supplier_id','private_margin'}
          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in forbidden:
                          raise SystemExit(f'Private field leaked into public snapshot: {key}')
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(public)
          print(f"Public snapshot parity OK: {public['productCount']} products / {public['variantCount']} variants")
          PY

      - name: Upload generated catalog artifacts
        uses: actions/upload-artifact@v4
        with:
          name: commerce-core-catalog-preview
          path: |
            /tmp/pepmax-products.json
            /tmp/public-catalog.json
            /tmp/catalog-audit.json
          retention-days: 7

      - name: Guard public/private boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          public_roots=[Path('index.html'), Path('assets'), Path('shop'), Path('peptides'), Path('biblioteca'), Path('politicas')]
          patterns=[
              re.compile(r'\bsupplier_cost\b', re.I),
              re.compile(r'\bsupplier_id\b', re.I),
              re.compile(r'\bprivate_margin\b', re.I),
          ]
          hits=[]
          for root in public_roots:
              paths=[root] if root.is_file() else (root.rglob('*') if root.exists() else [])
              for path in paths:
                  if not path.is_file() or path.suffix.lower() in {'.webp','.png','.jpg','.jpeg','.gif','.ico','.woff','.woff2'}:
                      continue
                  try:
                      text=path.read_text(errors='ignore')
                  except Exception:
                      continue
                  for pattern in patterns:
                      if pattern.search(text):
                          hits.append(f'{path}: {pattern.pattern}')
          if hits:
              raise SystemExit('Private commerce field leaked to public tree:\n'+'\n'.join(hits))
          print('Public/private boundary OK')
          PY
